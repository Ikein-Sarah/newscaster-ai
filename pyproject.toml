[project]
name = "ai-news-aggregator"
version = "0.1.0"
description = "Daily AI news briefing: scrape AI blogs, analyze with an LLM, email a digest"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "dotenv>=0.9.9",
    "feedparser>=6.0.12",
    "openai>=2.52.0",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "sqlalchemy>=2.0.51",
    "trafilatura>=2.1.0",
    "youtube-transcript-api[default]>=1.2.4",
]
